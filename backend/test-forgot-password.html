<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
            color: #1a1a1a;
            font-size: 28px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e5e5;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result.show {
            display: block;
        }

        .reset-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #e5e5e5;
        }

        pre {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 Test Forgot Password</h1>
        <p>Test the forgot password functionality</p>

        <!-- Forgot Password Form -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <button onclick="testForgotPassword()">Send Reset Code</button>

        <div id="forgotResult" class="result"></div>

        <!-- Reset Password Form -->
        <div class="reset-section">
            <h1>🔑 Reset Password</h1>
            <p>Enter the reset code you received</p>

            <div class="form-group">
                <label for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="code">Reset Code</label>
                <input type="text" id="code" placeholder="Enter 6-digit code">
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password (min 8 chars)">
            </div>

            <button onclick="testResetPassword()">Reset Password</button>

            <div id="resetResult" class="result"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/auth';

        async function testForgotPassword() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('forgotResult');

            if (!email) {
                showResult(resultDiv, 'error', 'Please enter an email address');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    let message = data.message;
                    if (data.developmentCode) {
                        message += `<br><br><strong>Development Code: ${data.developmentCode}</strong><br><small>(Email sending failed, but code was generated)</small>`;
                    }
                    showResult(resultDiv, 'success', message);

                    // Auto-fill email in reset form
                    document.getElementById('resetEmail').value = email;
                    if (data.developmentCode) {
                        document.getElementById('code').value = data.developmentCode;
                    }
                } else {
                    showResult(resultDiv, 'error', data.message || 'Request failed');
                }

                // Show raw response
                console.log('Response:', data);
                resultDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;

            } catch (error) {
                showResult(resultDiv, 'error', `Network error: ${error.message}`);
                console.error('Error:', error);
            }
        }

        async function testResetPassword() {
            const email = document.getElementById('resetEmail').value;
            const code = document.getElementById('code').value;
            const password = document.getElementById('newPassword').value;
            const resultDiv = document.getElementById('resetResult');

            if (!email || !code || !password) {
                showResult(resultDiv, 'error', 'Please fill in all fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, code, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(resultDiv, 'success', data.message);
                } else {
                    showResult(resultDiv, 'error', data.message || 'Request failed');
                    if (data.errors) {
                        resultDiv.innerHTML += '<ul>' + data.errors.map(e => `<li>${e}</li>`).join('') + '</ul>';
                    }
                }

                // Show raw response
                console.log('Response:', data);
                resultDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;

            } catch (error) {
                showResult(resultDiv, 'error', `Network error: ${error.message}`);
                console.error('Error:', error);
            }
        }

        function showResult(element, type, message) {
            element.className = `result ${type} show`;
            element.innerHTML = message;
        }
    </script>
</body>

</html>
